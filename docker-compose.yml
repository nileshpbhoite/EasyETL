services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: easyetl
      POSTGRES_USER: easyetl
      POSTGRES_PASSWORD: easyetl
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easyetl"]
      interval: 3s
      retries: 20

  api:
    build: ./backend
    env_file: [.env]
    environment:
      EASYETL_DATABASE_URL: postgresql+psycopg://easyetl:easyetl@postgres:5432/easyetl
      EASYETL_STORAGE_ROOT: /data/storage
      EASYETL_CORS_ORIGINS: '["http://localhost:3000"]'
    volumes: [storage:/data]
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["8000:8000"]

  web:
    build:
      context: ./frontend
      args: { BACKEND_URL: "http://api:8000" }
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  pgdata:
  storage:
